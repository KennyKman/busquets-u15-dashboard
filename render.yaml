services:
  - type: web
    name: busquets-u15-dashboard
    runtime: static
    buildCommand: echo "No build step needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
